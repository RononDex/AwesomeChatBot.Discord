name: .NET Core

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - name: Setup .NET Core
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.x
    - name: Install dependencies
      # Release config, since Debug references ../AwesomeChatBot which isn't checked out in CI
      run: dotnet restore ./AwesomeChatBot.Discord.csproj -p:Configuration=Release
    - name: Build
      run: dotnet build ./AwesomeChatBot.Discord.csproj --configuration Release --no-restore
