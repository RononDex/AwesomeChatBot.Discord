name: Publish package to nuget.org
on:
  push:
    tags:
      - "v*" # e.g. v1.9.0, must match <Version> in the csproj
permissions:
  contents: read
  id-token: write # NuGet Trusted Publishing (OIDC)
jobs:
  publish:
    name: build, pack & publish
    runs-on: ubuntu-latest
    environment: release # must match the environment in the nuget.org Trusted Publishing policy
    steps:
      - uses: actions/checkout@v7

      - name: Setup dotnet
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      # Fail instead of publishing a package whose version differs from the tag
      - name: Check tag matches version
        run: |
          version=$(dotnet msbuild AwesomeChatBot.Discord.csproj -getProperty:Version)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match csproj version $version"
            exit 1
          fi

      - name: Pack
        # GeneratePackageOnBuild in the csproj makes pack run inside its own build, before the dll exists (NU5026)
        run: dotnet pack AwesomeChatBot.Discord.csproj --configuration Release --output nupkg -p:GeneratePackageOnBuild=false

      - name: NuGet login
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ vars.NUGET_USER }}

      - name: Push
        run: dotnet nuget push "nupkg/*.nupkg" --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json
